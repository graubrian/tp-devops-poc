name: CI

on:
  # en main no corre solo: lo llama el workflow de release antes de publicar
  workflow_call:
  pull_request:
    branches: [main]

# si llega un push nuevo al mismo PR, se cancela la corrida anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run lint:check

  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm test -- --ci

  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run test:e2e -- --ci

  # Construye la imagen de producción (incluye el `nest build`) sin publicarla:
  # si el Dockerfile se rompe, el PR no se integra
  build:
    name: Build
    needs: [lint, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
