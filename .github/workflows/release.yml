name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# un release a la vez, sin cancelar uno que ya está publicando
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEN: docker.io/${{ vars.DOCKERHUB_USERNAME }}/tp-devops-poc

jobs:
  # Mismo CI que en los PRs: si algo falla acá, no se publica nada
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Calcula la versión desde los Conventional Commits (feat → minor, fix → patch)
  # y crea el tag vX.Y.Z con su GitHub Release
  version:
    name: Versionado SemVer
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publicada: ${{ steps.semver.outputs.new_release_published }}
      version: ${{ steps.semver.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semver
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publicar imagen
    needs: version
    if: needs.version.outputs.publicada == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.description=API de tareas del TP integrador de DevOps
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha

  # Le avisa a Render que despliegue exactamente la imagen recién publicada
  deploy:
    name: Deploy a Render
    needs: [version, docker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK_URL, no se despliega"
            exit 0
          fi
          IMG_URL=$(jq -rn --arg v "$IMAGEN:$VERSION" '$v|@uri')
          curl --fail --silent --show-error -X POST "${HOOK}&imgURL=${IMG_URL}"
          echo "Deploy pedido para $IMAGEN:$VERSION"
